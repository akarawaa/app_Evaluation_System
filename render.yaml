services:
  - type: web
    name: e-appraisal-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        value: ""
      - key: CORS_ORIGINS
        sync: false
      # Brevo transactional email API for notices we compose ourselves
      # (password-changed today; the deferred employee-acknowledgement email
      # phase reuses this account). Was SMTP -- switched after Render was
      # found to block all outbound SMTP at the network level (see
      # services/email.py).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: "ฝ่ายบุคคล"
      - key: FRONTEND_URL
        value: "https://app-evaluation-system.vercel.app"
      # Daily digest email cron trigger -- see services/notifications.py.
      # Set up an external scheduler (e.g. cron-job.org, same idea as the
      # UptimeRobot keep-alive ping) to POST /api/notifications/daily-digest
      # once a day with header X-Cron-Secret matching this value.
      - key: CRON_SECRET
        sync: false
